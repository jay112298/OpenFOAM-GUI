[pytest]
# `pytest` from the venv should work as well as `python -m pytest`: without
# this, only the latter puts the backend root on sys.path and `import app` fails.
pythonpath = .
testpaths = tests
filterwarnings =
    # foamlib warns when it normalises scheme strings to tokens and on/off to
    # bool; the OpenFOAM output it writes is correct, so this is pure noise
    ignore::UserWarning:foamlib._files._serialization
    ignore::UserWarning:foamlib._files.files
